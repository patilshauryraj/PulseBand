version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: pulseband-postgres
    environment:
      POSTGRES_USER: pulseuser
      POSTGRES_PASSWORD: pulsepassword123
      POSTGRES_DB: pulseband_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulseuser -d pulseband_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pulseband-api
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app/backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://pulseuser:pulsepassword123@postgres:5432/pulseband_db
      - JWT_SECRET=pulseband_super_secret_jwt_key_development_only_2026
      - JWT_REFRESH_SECRET=pulseband_super_secret_refresh_key_2026
      - ENVIRONMENT=production
    depends_on:
      postgres:
        condition: service_healthy

  mobile:
    build:
      context: ./mobile
      dockerfile: Dockerfile
    container_name: pulseband-mobile
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:8000

volumes:
  postgres_data:
